<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Qingxuan Wang monogram</title>
  <desc id="desc">A restrained blue-grey placeholder portrait with the initials QW.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4f7"/>
      <stop offset="1" stop-color="#d9e5eb"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#background)"/>
  <circle cx="300" cy="300" r="225" fill="none" stroke="#c7d7df" stroke-width="3"/>
  <text x="300" y="340" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="142" fill="#597486">QW</text>
</svg>
